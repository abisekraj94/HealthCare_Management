# Disable Flyway for tests to avoid migration errors
spring.flyway.enabled=false

# Configure H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none

jwt.secret=mysupersecurejwtsecretkey1234567890abcd
jwt.expiration=86400000

spring.flyway.baseline-on-migrate=true

spring.profiles.active=test

# Allow bean definition overriding in test profile
spring.main.allow-bean-definition-overriding=true

# Hibernate property to use non-contextual LOB creation in test profile
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
